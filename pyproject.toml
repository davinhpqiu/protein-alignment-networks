[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-alignment-networks"
version = "0.1.0"
description = "Reproducible protein sequence alignment network experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "biopython>=1.83,<2",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.1,<5",
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
